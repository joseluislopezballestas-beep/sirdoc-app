name: Publicar SirDoc (solo si pasan las pruebas)
# Despliega GitHub Pages SOLO cuando npm test pasa (H-22 / M24).
# Activación (una vez, en GitHub): Settings → Pages → Source: "GitHub Actions"
# y Settings → Secrets and variables → Actions → Variables: PAGES_ACTIONS = true.
# Mientras no se active, este flujo corre las pruebas y omite el despliegue.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
  deploy:
    needs: test
    if: ${{ vars.PAGES_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar solo los archivos de la app
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          [ -f .nojekyll ] && cp .nojekyll _site/ || touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
